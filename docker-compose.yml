# Startet App + Datenbank. Die App lauscht nur lokal (127.0.0.1:3010);
# nach außen geht es über den Reverse-Proxy (Caddy oder nginx) auf dem Server.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: empfang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: empfang
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empfang"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://empfang:${POSTGRES_PASSWORD}@db:5432/empfang
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  db-data:
