# Alternative, falls auf dem Server nginx statt Caddy läuft.
# SSL danach mit: sudo certbot --nginx -d chatbot.pdf-libre.de
server {
    listen 80;
    server_name chatbot.pdf-libre.de;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming im Chat nicht puffern
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
